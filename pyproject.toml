[project]
name = "thinknxg_rental_marketplace"
authors = [{ name = "thinkNXG", email = "info@thinknxg.com" }]
description = "thinkNXG Rental Marketplace — multi-vendor tender & bidding marketplace for scaffolding, formwork and construction equipment"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
